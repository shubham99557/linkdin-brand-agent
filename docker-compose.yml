# Local PostgreSQL for parity and concurrency tests (development only).
# Bound to 127.0.0.1 only. Password comes from LBE_PG_PASSWORD in your local .env.
# Version matches the embedded PGlite engine (PostgreSQL 18.6).
services:
  postgres:
    image: postgres:18.6-alpine3.23
    container_name: lbe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LBE_PG_PASSWORD:?set LBE_PG_PASSWORD in .env (npm run setup:local)}
      POSTGRES_DB: lbe
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - lbe-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lbe"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  lbe-pgdata:
